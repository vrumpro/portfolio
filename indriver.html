<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="inDrive: маршрут, цена и выбор курьера. Портфолио Алексея Пашкова.">
    <meta name="theme-color" content="#f7f7f5">
    <title>inDrive — Заказ курьерской доставки · Алексей Пашков</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="./assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <style>
#site-preloader{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:#fafaf8;color:#171917;transition:opacity .25s ease;pointer-events:auto}
#site-preloader.is-finished{opacity:0;pointer-events:none}
.preloader-content{display:grid;justify-items:center;gap:18px;font-family:Arial,sans-serif}
.preloader-name{font-size:18px;font-weight:500;letter-spacing:-.3px}
.preloader-label{font-size:12px;color:#777}
.preloader-line{width:120px;height:2px;overflow:hidden;background:#e3e4df}
.preloader-line:after{content:"";display:block;width:45%;height:100%;background:#222;animation:loader-slide 1.1s ease-in-out infinite}
@keyframes loader-slide{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
html.is-loading #app{visibility:hidden}
@media(prefers-reduced-motion:reduce){#site-preloader{transition:none}.preloader-line:after{animation:none;width:100%}}
</style>
<script>document.documentElement.classList.add('is-loading');window.__preloadFallback=setTimeout(function(){document.documentElement.classList.remove('is-loading');document.getElementById('site-preloader')?.remove()},10000);</script>
<link rel="preload" href="./assets/fonts/Manrope-Variable.ttf" as="font" type="font/ttf" crossorigin>
</head>
  <body class="case-page mobility">
    <div id="site-preloader" role="status" aria-live="polite"><div class="preloader-content"><span class="preloader-name">Алексей Пашков</span><span class="preloader-line" aria-hidden="true"></span><span class="preloader-label">Загрузка портфолио</span></div></div>
<div id="app" data-case="indriver"></div>
    <noscript><style>#site-preloader{display:none}</style>Для просмотра портфолио включите JavaScript в браузере.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
